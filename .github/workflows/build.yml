name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar proyecto
        run: |
          mkdir -p www && cp index.html www/
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
      - name: Reproductor nativo (ExoPlayer / Media3)
        run: |
          PKG=com/luisdornellez/tunochedeesperanza
          cp *.java android/app/src/main/java/$PKG/
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.media3:media3-exoplayer:1.5.1"\n    implementation "androidx.media3:media3-session:1.5.1"\n    implementation "androidx.media3:media3-datasource-okhttp:1.5.1"\n    implementation "com.squareup.okhttp3:okhttp:4.12.0"/' android/app/build.gradle
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <application android:usesCleartextTraffic="true"#' $M
          sed -i 's#</application>#<service android:name=".RadioService" android:foregroundServiceType="mediaPlayback" android:exported="true">\n            <intent-filter><action android:name="androidx.media3.session.MediaSessionService"/></intent-filter>\n        </service>\n        <service android:name=".KeepAliveService" android:foregroundServiceType="mediaPlayback" android:exported="false"/>\n    </application>#' $M
          grep -n "Service\|usesCleartext" $M
      - name: Compilar
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tu-noche-de-esperanza
          path: android/app/build/outputs/apk/debug/app-debug.apk
