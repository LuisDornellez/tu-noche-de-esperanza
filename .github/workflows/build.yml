name: Construir APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Descomprimir la app
        run: unzip -q radio-app.zip

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          build-root-directory: radio-app

      - name: Compilar APK firmado
        working-directory: radio-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp radio-app/app/build/outputs/apk/release/app-release.apk Palabras-de-Esperanza.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Palabras-de-Esperanza-APK
          path: Palabras-de-Esperanza.apk

      - name: Publicar en Releases (solo si subes una etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Palabras-de-Esperanza.apk
